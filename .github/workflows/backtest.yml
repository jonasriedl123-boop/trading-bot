name: Rueckblick-Test

on:
  workflow_dispatch:
    inputs:
      ab:
        description: "Start-Datum (JJJJ-MM-TT)"
        required: true
        default: "2023-01-01"

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rueckblick-Test
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python3 backtest.py "${{ github.event.inputs.ab }}"
      - name: Speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add BACKTEST.md
          git diff --cached --quiet && exit 0
          git commit -m "Rueckblick-Test $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
