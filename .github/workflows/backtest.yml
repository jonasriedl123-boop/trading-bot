name: Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tests mit Fake-Kursen (keine Zukunfts-Daten, Rechnung stimmt)
        run: python3 test_strategien.py && python3 test_bot.py > /dev/null
      - name: Backtest
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python3 backtest.py
      - name: Speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add BACKTEST.md daten/backtest_ergebnis.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
