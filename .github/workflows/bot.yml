name: Trading-Bot

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten (GitHub startet manchmal spaeter)
  workflow_dispatch:
    inputs:
      modus:
        description: "lauf = handeln, pruefen = nur anschauen, stats = Auswertung"
        required: true
        default: "pruefen"
        type: choice
        options: [pruefen, lauf, stats]

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Python 3 ist auf ubuntu-latest schon da (spart Minuten). Keine Zusatz-Pakete noetig.
      - name: Bot laufen lassen
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py "${{ github.event.inputs.modus || 'lauf' }}"

      - name: Protokoll speichern (Commit haelt den Zeitplan aktiv)
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add daten JOURNAL.md BERICHT.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Bot: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
