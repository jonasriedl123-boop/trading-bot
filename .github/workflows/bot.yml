name: Trading-Bot

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten (GitHub startet manchmal spaeter)
  workflow_dispatch:
    inputs:
      modus:
        description: "lauf = handeln, pruefen = nur anschauen, stats = Auswertung"
        required: true
        default: "pruefen"
        type: choice
        options: [pruefen, lauf, stats]

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot laufen lassen
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python3 bot.py "${{ github.event.inputs.modus || 'lauf' }}"

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add daten JOURNAL.md BERICHT.md 2>/dev/null || git add daten JOURNAL.md
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git commit -m "Bot: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
